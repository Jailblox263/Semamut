name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main

      - name: Subir el .geode
        uses: actions/upload-artifact@v4
        with:
          name: auto-click-fix-windows
          path: |
            build/*.geode
            **/*.geode
          if-no-files-found: error
